services:
  backend:
    environment:
      ENABLE_LOCAL_LLM: "true"
  ollama:
    image: ollama/ollama:0.34.0
    network_mode: "service:backend"
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
volumes:
  ollama_models:
