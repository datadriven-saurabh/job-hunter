services:
  - type: web
    name: job-hunter-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.hosted
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ENABLE_LIVE_SUBMISSION
        value: "false"
      - key: ENABLE_LOCAL_LLM
        value: "false"
      - key: ENABLE_OPENROUTER
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_FREE_MODELS
        value: "deepseek/deepseek-v4-flash-0731:free,qwen/qwen3.8-27b:free"
      - key: MAX_OPENROUTER_REQUESTS_PER_DAY
        value: "40"
      - key: MAX_OPENROUTER_REQUESTS_PER_USER_PER_DAY
        value: "8"
      - key: ENABLE_GROQ
        value: "false"
      - key: GROQ_FREE_TIER_CONFIRMED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_GROQ_REQUESTS_PER_DAY
        value: "120"
      - key: MAX_GROQ_REQUESTS_PER_USER_PER_DAY
        value: "30"
      - key: MAX_GROQ_TOKENS_PER_DAY
        value: "180000"
