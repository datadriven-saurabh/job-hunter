services:
  backend:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    environment:
      ENABLE_LIVE_SUBMISSION: "false"
      ENABLE_LOCAL_LLM: "false"
      TRUSTED_EXTENSION_IDS: "${TRUSTED_EXTENSION_IDS:-}"
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
