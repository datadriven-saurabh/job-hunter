<!doctype html><html><head><meta charset="utf-8"><title>Job Hunter — Application Assistant</title><style>body{font:13px system-ui;width:320px;padding:20px;color:#172337}h1{font-size:20px}h2{font-size:14px;margin:22px 0 4px;border-top:1px solid #e4dcec;padding-top:18px}p{color:#64748b;line-height:1.55}label{display:block;margin-top:11px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #e4dcec;border-radius:7px}textarea{resize:vertical}button{background:#4f46b8;color:white;cursor:pointer}button.secondary{background:#fff;color:#4f46b8}button:disabled{opacity:.55}a{display:block;margin-top:15px;color:#4f46b8}#capture-form{display:none}#status{font-size:12px}</style></head><body><h1>Job Hunter</h1><p>Capture the LinkedIn hiring post you are viewing, or fill a reviewed application.</p><button class="secondary" id="capture">Capture visible LinkedIn post</button><form id="capture-form"><label>Job title<input id="capture-title" required maxlength="200"></label><label>Company<input id="capture-company" required maxlength="150"></label><label>Location<input id="capture-location" required maxlength="300"></label><label>Application or post URL<input id="capture-url" type="url" required></label><label>Visible post text<textarea id="capture-description" rows="7" required minlength="20" maxlength="50000"></textarea></label><button id="import" type="submit">Import and match</button></form><h2>Application autofill</h2><label>Application<select id="job"><option>Loading applications…</option></select></label><button id="fill">Fill this application</button><p id="status" role="status"></p><a id="resume" hidden>Download tailored resume</a><script src="job-url.js"></script><script src="popup.js"></script></body></html>
